<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>콘솔창 계산기 프로그램</title>
  </head>

  <body>
    <h1>콘솔창 계산기 프로그램</h1>

    <h2>Windows OS의 경우</h2>
    <p>1. F12 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. 콘솔 창에 start()를 입력하여 계산기를 실행합니다.</p>

    <hr />

    <h2>Mac OS의 경우</h2>
    <p>1. Option + Command + J 키를 눌러 콘솔 창을 여세요.</p>
    <p>2. 콘솔 창에 start()를 입력하여 계산기를 실행합니다.</p>

    <script src="./calculator.js"></script>
  </body>
</html>
